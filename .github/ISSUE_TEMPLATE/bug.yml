name: Bug
description: Something broke or a hook got in the way
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx claude-lean doctor`
      render: text
  - type: input
    id: versions
    attributes:
      label: claude-lean, Claude Code and OS versions
      placeholder: "0.2.0 / 2.1.239 / Ubuntu 22.04"
