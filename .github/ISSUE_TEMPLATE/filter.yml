name: Filter request
description: A command whose output wastes tokens
labels: [filter]
body:
  - type: input
    id: cmd
    attributes:
      label: Command
      placeholder: "terraform plan"
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample output (remove secrets), and which lines must be kept
      render: text
    validations:
      required: true
