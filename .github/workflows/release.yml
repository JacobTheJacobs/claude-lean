# Push a tag like v0.2.0 (matching package.json) to test, publish to npm with provenance, and cut a GitHub release.
# With the repo secret NPM_TOKEN it also publishes to npm; without it, that step is skipped.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      - name: Publish to npm (skipped without the NPM_TOKEN secret; publish by hand with `npm publish`)
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |   # a version already on npm (published by hand) is fine: skip instead of failing
          v=$(node -p 'require("./package.json").version')
          if npm view "claude-lean@$v" version >/dev/null 2>&1; then echo "claude-lean@$v already on npm"; exit 0; fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "release $GITHUB_REF_NAME already exists"; exit 0; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
