name: Claude Lean
description: Cut Claude Code costs in CI. Trims noisy test and build output and drops unused tool definitions from every request. Local, no telemetry.
author: JacobTheJacobs
branding:
  icon: scissors
  color: orange
inputs:
  filter:
    description: Trim noisy pytest, npm, cargo, go, docker and make output before Claude reads it (originals are kept).
    default: "true"
  slim:
    description: Turn off Claude Code features CI runs rarely use (Artifacts, Workflows, cron, background tasks, advisor, git instructions).
    default: "true"
runs:
  using: composite
  steps:
    - name: Install Claude Lean into ~/.claude
      shell: bash
      env:
        LEAN_FILTER: ${{ inputs.filter }}
        LEAN_SLIM: ${{ inputs.slim }}
      run: |
        flags=()
        [ "$LEAN_FILTER" = "false" ] && flags+=(--no-filter)
        [ "$LEAN_SLIM" = "false" ] && flags+=(--no-slim)
        bash "$GITHUB_ACTION_PATH/install.sh" "${flags[@]}"
